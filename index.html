<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link id="appManifest" rel="manifest" href="__CODEX_BASE__/manifest.json">
  <link id="appIcon" rel="icon" type="image/svg+xml" href="__CODEX_BASE__/api/assets/pwa">
  <title>Codex</title>
  <style>
    :root {
      color-scheme: dark;
      --sidebar-width: clamp(240px, 19vw, 310px);
      --rail-width: 270px;
      --bg: #000000;
      --panel: #0b0b0b;
      --panel-2: #151515;
      --line: #2d2d2d;
      --text: #ececec;
      --muted: #9b9b9b;
      --muted-2: #707070;
      --accent: #10a37f;
      --user: #2f2f2f;
      --codex-icon-filter: invert(1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { min-height: 100svh; overflow: hidden; }
    body.auth-pending .app, body.auth-pending #backdrop, body.auth-pending #toast { visibility: hidden; }
    body.auth-pending::before { content: ''; position: fixed; inset: 0; z-index: 90; background: var(--bg); }
    button, textarea, input { font: inherit; }
    button { color: inherit; }
    .app { height: 100svh; display: flex; overflow: hidden; }
    .backdrop { display: none; }

    .sidebar {
      width: var(--sidebar-width); flex: 0 0 var(--sidebar-width); background: #0b0b0b; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; padding: 12px; z-index: 20;
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 14px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 650; letter-spacing: -.2px; }
    .brand-mark { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid #5a5a5a; border-radius: 8px; overflow: hidden; }
    .brand-mark img { width: 17px; height: 17px; filter: var(--codex-icon-filter); }
    .icon-button { width: 34px; height: 34px; border: 0; border-radius: 8px; display: grid; place-items: center; background: transparent; color: #c7c7c7; cursor: pointer; }
    .icon-button:hover { background: #292929; }
    .icon-button svg { width: 19px; height: 19px; }
    .desktop-nav { display: none; }
    .new-chat { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1px solid #3a3a3a; border-radius: 9px; background: #212121; cursor: pointer; text-align: left; }
    .new-chat:hover { background: #2a2a2a; }
    .new-chat svg { width: 18px; height: 18px; color: #e8e8e8; }
    .search { position: relative; margin: 12px 0 9px; }
    .search svg { position: absolute; left: 11px; top: 10px; width: 16px; color: var(--muted); }
    .search input { width: 100%; border: 1px solid transparent; outline: 0; border-radius: 8px; padding: 9px 10px 9px 34px; color: var(--text); background: #212121; }
    .search input:focus { border-color: #4d4d4d; }
    .conversation-list { flex: 1; overflow-y: auto; padding-right: 2px; }
    .list-label { color: var(--muted-2); font-size: 12px; padding: 6px 9px; text-transform: uppercase; letter-spacing: .05em; }
    .conversation { width: 100%; display: block; border: 0; border-radius: 8px; background: transparent; color: var(--text); padding: 10px 10px; text-align: left; cursor: pointer; margin: 2px 0; }
    .conversation:hover { background: #252525; }
    .conversation.active { background: #2b2b2b; }
    .conversation-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .conversation-time { float: right; color: var(--muted-2); font-size: 11px; margin-left: 8px; }
    .conversation-spinner { float: right; width: 13px; height: 13px; margin: 1px 1px 0 8px; border: 2px solid #666; border-top-color: #e7e7e7; border-radius: 50%; animation: conversation-spin .8s linear infinite; }
    @keyframes conversation-spin { to { transform: rotate(360deg); } }
    .empty-list { color: var(--muted); font-size: 13px; line-height: 1.6; padding: 18px 10px; }
    .sidebar-footer { color: var(--muted-2); font-size: 11px; padding: 12px 7px 2px; line-height: 1.5; }

    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    .topbar { position: relative; height: 58px; flex: 0 0 58px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 18px; }
    .menu-button { display: none; }
    .top-title { min-width: 0; flex: 1; }
    .top-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; font-size: 15px; font-weight: 600; }
    .top-title p { margin: 3px 0 0; color: var(--muted-2); font-size: 11px; }
    .model-picker { position: relative; flex: 0 0 auto; }
    .model-button { display: flex; align-items: center; gap: 7px; max-width: 190px; padding: 7px 9px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #d5d5d5; cursor: pointer; }
    .model-button:hover, .model-button.open { border-color: #3f3f3f; background: #242424; }
    .model-button svg { width: 14px; color: var(--muted); }
    .model-button-text { min-width: 0; text-align: left; }
    .model-button-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
    .model-button-effort { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .model-menu { position: absolute; right: 0; top: calc(100% + 7px); width: 252px; max-height: min(460px, 70vh); overflow-y: auto; padding: 7px; border: 1px solid #3d3d3d; border-radius: 12px; background: #292929; box-shadow: 0 16px 42px rgba(0,0,0,.42); z-index: 30; }
    .model-menu[hidden] { display: none; }
    .model-menu-label { padding: 7px 9px 5px; color: #8e8e8e; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
    .model-option { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px; border: 0; border-radius: 8px; background: transparent; color: #e7e7e7; text-align: left; cursor: pointer; }
    .model-option:hover { background: #3a3a3a; }
    .model-option.selected { background: #3a3a3a; }
    .model-option-main { min-width: 0; }
    .model-option-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .model-option-desc { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; color: #999; font-size: 10px; }
    .model-option-check { color: #9ee6cc; font-size: 16px; }
    .effort-options { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 2px; }
    .effort-option { padding: 8px 5px; border: 0; border-radius: 7px; background: transparent; color: #cfcfcf; cursor: pointer; font-size: 11px; }
    .effort-option:hover { background: #3a3a3a; }
    .effort-option.selected { background: #10a37f; color: #fff; }
    .delete-button { color: #a6a6a6; }
    .delete-button:hover { color: #f87171; }
    .messages { flex: 1; overflow-y: auto; padding: 26px 20px 150px; scroll-behavior: smooth; }
    .message-column { width: min(820px, 100%); margin: 0 auto; }
    .conversation-loading { margin: 18vh auto 0; color: var(--muted); text-align: center; font-size: 13px; }
    .welcome { max-width: 640px; margin: 16vh auto 0; text-align: center; color: var(--muted); line-height: 1.7; }
    .welcome-mark { width: 44px; height: 44px; display: grid; place-items: center; margin: 0 auto 16px; border: 1px solid #555; border-radius: 14px; color: #d4d4d4; }
    .welcome-mark img { width: 27px; height: 27px; filter: var(--codex-icon-filter); }
    .welcome h2 { margin: 0 0 8px; color: var(--text); font-size: 21px; font-weight: 600; }
    .welcome p { margin: 0; font-size: 13px; }
    .message { display: flex; gap: 13px; margin: 24px 0; align-items: flex-start; }
    .avatar { width: 32px; height: 32px; flex: 0 0 32px; display: grid; place-items: center; border: 0; border-radius: 0; background: transparent; color: #ddd; font-size: 12px; font-weight: 700; }
    .avatar img { width: 100%; height: 100%; object-fit: contain; border-radius: 0; }
    .avatar img.codex-avatar-image { padding: 0; filter: var(--codex-icon-filter); }
    .message-body { min-width: 0; flex: 1; padding-top: 2px; }
    .message-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .message-name { color: #d7d7d7; font-size: 12px; font-weight: 650; }
    .message-time { color: var(--muted-2); font-size: 10px; }
    .message-content { color: #e4e4e4; font-size: 14px; line-height: 1.72; overflow-wrap: anywhere; }
    .message-content a.message-link { display: inline-flex; align-items: center; gap: 4px; color: #7db7ff; font-weight: 600; text-decoration: none; overflow-wrap: anywhere; vertical-align: -2px; }
    .message-link-icon { width: 15px; height: 15px; flex: 0 0 15px; object-fit: contain; border-radius: 3px; }
    .message-link-icon.link-icon-openai { filter: var(--codex-icon-filter); }
    .message-content a.message-link:hover { text-decoration: underline; }
    .message.user .message-content { display: inline-block; padding: 9px 13px; border-radius: 14px; background: var(--user); line-height: 1.55; }
    .message.user { justify-content: flex-end; }
    .message.user .message-body { order: 1; flex: 0 1 auto; max-width: min(78%, 680px); text-align: right; }
    .message.user .avatar { order: 2; }
    .message.user .message-head { justify-content: flex-end; }
    .message.user .message-content { text-align: left; }
    .message.user .image-grid { justify-content: flex-end; }
    .message.error .message-content { color: #fca5a5; }
    .message-content pre { overflow-x: auto; margin: 6px 0; padding: 7px 9px; border: 1px solid #333; border-radius: 8px; background: #0b0b0b; color: #d6d6d6; font-size: 14px; line-height: 1.5; }
    .message-content code { padding: 2px 5px; border-radius: 4px; background: #2b2b2b; color: #d9f99d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
    .message-content pre code { padding: 0; background: transparent; color: inherit; }
    .file-change-list { display: grid; gap: 6px; margin-top: 11px; }
    .file-change-card { width: min(640px, 100%); display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 9px; border: 1px solid #292929; border-radius: 9px; background: #101010; color: #bdbdbd; font-size: 12px; line-height: 1.35; }
    .file-change-icon { width: 22px; height: 22px; flex: 0 0 22px; display: grid; place-items: center; color: #aaa; }
    .file-change-icon svg { width: 17px; height: 17px; }
    .file-change-main { min-width: 0; flex: 1; }
    .file-change-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c8c8c8; font-weight: 600; }
    .file-change-stats { display: flex; gap: 6px; margin-top: 2px; font-size: 11px; }
    .file-change-add { color: #62c58b; }
    .file-change-remove { color: #e17b83; }
    .file-change-card:not(.file-change-card-group) .file-change-main { display: flex; align-items: center; gap: 8px; }
    .file-change-card:not(.file-change-card-group) .file-change-title { min-width: 0; }
    .file-change-card:not(.file-change-card-group) .file-change-stats { flex: 0 0 auto; margin: 0 0 0 auto; }
    .file-change-card-group { display: grid; grid-template-columns: 18px minmax(0, 1fr); column-gap: 7px; align-items: start; margin-top: 18px; padding: 4px 8px 2px; }
    .file-change-card-group .file-change-icon { width: 18px; height: 18px; align-self: center; margin-top: 0; }
    .file-change-card-group .file-change-icon svg { width: 16px; height: 16px; }
    .file-change-group-main { min-width: 0; align-self: center; }
    .file-change-group-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .file-change-group-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c8c8c8; font-size: 13px; font-weight: 600; }
    .file-change-group-stats { display: flex; gap: 6px; flex: 0 0 auto; font-size: 11px; line-height: 1.25; }
    .file-change-rows { grid-column: 1 / -1; min-width: 0; margin-top: -2px; padding-top: 1px; border-top: 1px solid #292929; }
    .file-change-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; padding: 2px 2px; color: #9e9e9e; font-size: 11px; line-height: 1.2; }
    .file-change-row + .file-change-row { border-top: 0; }
    .file-change-path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-change-row-stats { display: flex; flex: 0 0 auto; gap: 5px; font-size: 11px; }
    .image-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .image-grid img { width: min(260px, 70vw); max-height: 260px; object-fit: cover; border: 1px solid #3b3b3b; border-radius: 10px; cursor: zoom-in; background: #0b0b0b; }
    .message-actions { display: flex; align-items: center; gap: 2px; margin-top: 7px; opacity: 0; transition: opacity .16s ease; }
    .message:hover .message-actions, .message:focus-within .message-actions { opacity: 1; }
    .message.user .message-actions { justify-content: flex-end; }
    .message-action { width: 25px; height: 25px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-2); cursor: pointer; }
    .message-action:hover { background: #292929; color: var(--text); }
    .message-action svg { width: 15px; height: 15px; }

    .run-panel { margin: 8px 0 18px 0; border: 0; border-radius: 0; background: transparent; overflow: hidden; text-align: left; }
    .run-header { width: 100%; display: flex; align-items: center; gap: 7px; min-height: 29px; padding: 5px 10px 7px 0; border: 0; border-bottom: 1px solid #292929; background: transparent; color: #b9b9b9; font: inherit; font-size: 12px; text-align: left; cursor: pointer; }
    .run-header:hover { color: #ededed; }
    .run-dot { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: #a1a1a1; box-shadow: 0 0 0 3px rgba(160,160,160,.12); animation: pulse 1s infinite alternate; }
    .run-panel.done .run-dot { animation: none; background: #666; box-shadow: none; }
    .run-panel.done .run-wave-char { animation: none; opacity: 1; transform: none; }
    .run-title { flex: 1; }
    .run-count { flex: 0 0 auto; color: #8b8b8b; font-size: 11px; }
    .run-toggle { width: 18px; flex: 0 0 18px; color: #8b8b8b; font-size: 14px; line-height: 1; text-align: center; transition: transform .16s ease; }
    .run-panel.collapsed .run-toggle { transform: rotate(-90deg); }
    .run-panel.collapsed .run-events { display: none; }
    .run-events { padding: 2px 0 4px 4px; }
    .run-command-group { padding: 3px 0; }
    .run-command-group-summary { width: 100%; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 0; border: 0; background: transparent; color: #969696; font-family: inherit; font-size: 12px; font-weight: 400; line-height: 1.45; text-align: left; cursor: pointer; }
    .run-command-group-summary:hover { color: #dedede; }
    .run-command-group-icon { width: 22px; flex: 0 0 22px; display: grid; place-items: center; line-height: 1; }
    .run-command-group-icon { font-size: 13px; }
    .run-command-group-icon svg { width: 16px; height: 16px; }
    .run-command-group-summary > span:not(.run-command-group-icon):not(.run-command-group-toggle),
    .run-command-group-count { font-family: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; }
    .run-command-group-count { color: #a6a6a6; }
    .run-command-group-toggle { width: 18px; flex: 0 0 18px; margin-left: auto; color: #8b8b8b; font-size: 14px; line-height: 1; text-align: center; transition: transform .16s ease; }
    .run-command-group.collapsed .run-command-group-toggle { transform: rotate(-90deg); }
    .run-command-group-rows { padding-left: 4px; }
    .run-command-group.collapsed .run-command-group-rows { display: none; }
    .run-command-group[data-status="running"] .run-command-group-summary { animation: run-command-active 2.8s ease-in-out infinite; }
    .run-event.run-todo-list { display: flex; flex-direction: column; align-items: stretch; gap: 0; max-width: min(340px, 100%); margin: 5px 0; padding: 6px 10px; border-radius: 9px; background: #202222; color: #c7c9c9; }
    .run-todo-item { display: flex; align-items: center; gap: 7px; min-height: 21px; font-size: 11px; line-height: 1.35; }
    .run-todo-item + .run-todo-item { margin-top: 1px; }
    .run-todo-icon { width: 13px; height: 13px; flex: 0 0 13px; display: grid; place-items: center; border: 1.2px solid #b7bbbb; border-radius: 50%; color: #b7bbbb; font-size: 9px; line-height: 1; }
    .run-todo-item.done { color: #858a8a; }
    .run-todo-item.done .run-todo-icon { border-color: #929797; color: #929797; }
    .run-todo-item.active .run-todo-icon { border-color: #d1d4d4; color: #d1d4d4; }
    .run-todo-text { min-width: 0; overflow-wrap: anywhere; }
    html[data-theme="light"] .run-todo-list { background: #f0f1f2; color: #50545a; }
    html[data-theme="light"] .run-todo-item.done { color: #8a8e93; }
    .run-event { display: flex; align-items: flex-start; gap: 6px; padding: 5px 0; color: #a7aaa8; font-size: 12px; line-height: 1.45; }
    .run-event + .run-event { border-top: 0; }
    .run-event-icon { width: 15px; flex: 0 0 15px; color: #969696; text-align: center; }
    .run-thought { margin-left: 0; }
    .run-thought .run-event-icon, .run-thought .run-event-label { display: none; }
    .run-event.error .run-event-icon, .run-event.error .run-event-label { color: #f59a9a; }
    .run-file-change { align-items: center; }
    .run-file-change .run-event-icon { width: 24px; flex-basis: 24px; font-size: 14px; }
    .run-file-change-name { color: #bcbcbc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-file-change-stats { display: inline-flex; gap: 5px; margin-left: 7px; font-size: 10px; white-space: nowrap; }
    .run-file-change-add { color: #62c58b; }
    .run-file-change-remove { color: #e17b83; }
    .run-file-summary { display: flex; align-items: center; gap: 6px; padding: 4px 0 2px 30px; color: #a9a9a9; font-size: 10px; line-height: 1.4; }
    .run-panel:not(.collapsed) .run-file-summary { display: none; }
    .run-file-summary[hidden] { display: none; }
    .run-event-body { min-width: 0; flex: 1; }
    .run-event-label { color: #a6a6a6; font-size: 12px; margin-right: 5px; }
    .run-event-text { overflow-wrap: anywhere; white-space: pre-wrap; }
    .run-terminal { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 20px; align-items: center; column-gap: 6px; }
    .run-terminal .run-event-icon { grid-column: 1; width: 22px; flex: 0 0 22px; display: grid; place-items: center; line-height: 1; margin-top: 0; }
    .run-terminal .run-event-icon svg { width: 16px; height: 16px; }
    .run-terminal .run-event-body { display: contents; }
    .run-terminal .run-event-label { grid-column: 3; margin-right: 0; white-space: nowrap; align-self: center; }
    .run-terminal-check { grid-column: 4; width: 20px; flex: 0 0 20px; height: 24px; display: grid; place-items: center; margin-top: 0; color: #969696; font-size: 15px; line-height: 1; text-align: center; }
    .run-terminal[data-status="completed"] .run-terminal-check { color: #35b779; }
    .run-terminal[data-status="error"] .run-terminal-check,
    .run-terminal[data-status="error"] .run-event-label { color: #e0525f; }
    .run-terminal-details { grid-column: 2; min-width: 0; }
    .run-event-command { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 3px 6px; border: 1px solid #3a3a3a; border-radius: 5px; background: #0b0b0b; color: #d2d2d2; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: left; cursor: pointer; }
    .run-terminal-details[open] .run-event-command { overflow: visible; text-overflow: clip; white-space: pre-wrap; overflow-wrap: anywhere; }
    .run-wave-char { display: inline; white-space: pre; }
    @keyframes run-command-active {
      0%, 70%, 100% { opacity: .62; }
      18%, 34% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .run-command-group[data-status="running"] .run-command-group-summary { animation: none; }
    }
    .run-event details { margin-top: 3px; }
    .run-event summary { color: #969696; cursor: pointer; font-size: 11px; }
    .run-event pre { max-height: 220px; overflow: auto; margin: 3px 0 0; padding: 6px; border: 1px solid #3a3a3a; border-radius: 6px; background: #0b0b0b; color: #c8c8c8; font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    html[data-theme="light"] .run-header { border-bottom-color: #d9dadd; color: #555960; }
    html[data-theme="light"] .run-header:hover { color: #202124; }
    html[data-theme="light"] .run-event { color: #505050; }
    html[data-theme="light"] .run-file-change-name { color: #4d5055; }
    html[data-theme="light"] .run-command-group-summary { color: #62656a; }
    html[data-theme="light"] .run-command-group-summary:hover { color: #202124; }
    html[data-theme="light"] .run-command-group-count { color: #555960; }
    html[data-theme="light"] .run-event-command,
    html[data-theme="light"] .run-event pre { border-color: #d0d0d0; background: #f4f4f4; color: #303030; }
    html[data-theme="light"] .file-change-card { border-color: #d9dadd; background: #f6f6f7; color: #555960; }

    .auth-screen { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: var(--bg); }
    .auth-screen[hidden] { display: none; }
    .auth-card { width: min(390px, 100%); padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 20px 60px rgba(0,0,0,.28); }
    .auth-logo { width: 46px; height: 46px; margin: 0 auto 18px; display: grid; place-items: center; }
    .auth-logo img { width: 100%; height: 100%; object-fit: contain; filter: var(--codex-icon-filter); }
    .auth-card h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 650; }
    .auth-card p { margin: 9px 0 22px; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
    .auth-form { display: grid; gap: 12px; }
    .auth-form [hidden] { display: none; }
    .auth-form label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    .auth-form input { width: 100%; padding: 11px 12px; border: 1px solid #3b3b3b; border-radius: 9px; outline: 0; background: var(--panel-2); color: var(--text); }
    .auth-form input:focus { border-color: var(--accent); }
    .auth-form label.auth-remember { display: flex; align-items: center; justify-content: flex-start; gap: 8px; color: var(--muted); font-size: 12px; cursor: pointer; }
    .auth-form label.auth-remember input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
    .auth-submit { margin-top: 4px; padding: 11px 14px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 650; }
    .auth-submit:disabled { opacity: .55; cursor: wait; }
    .auth-switch { width: 100%; margin-top: 14px; padding: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
    .auth-switch:hover { color: var(--text); }
    .auth-error { min-height: 18px; margin-top: 12px; color: #fda4af; font-size: 12px; line-height: 1.5; text-align: center; }
    .account-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 7px 2px; color: var(--muted); font-size: 11px; }
    .account-bar[hidden] { display: none; }
    .account-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-logout { padding: 4px 7px; border: 1px solid #3a3a3a; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; }
    .account-logout:hover { color: var(--text); border-color: #666; }

  <script>
    const base = location.pathname.replace(/\/$/, '');
    function revealAuthFallback(message = '') {
      if (!document.body.classList.contains('auth-pending')) return;
      document.body.classList.remove('auth-pending');
      const screen = document.getElementById('authScreen');
      const logo = document.getElementById('authLogo');
      if (logo) logo.src = `${base}/api/assets/openai`;
      if (screen) screen.hidden = false;
      const error = document.getElementById('authError');
      if (error && message) error.textContent = message;
    }
    window.setTimeout(() => revealAuthFallback('页面初始化超时，请刷新后重试。'), 2500);
    window.addEventListener('error', event => {
      if (!event.error && !event.filename) return;
      if (document.body.classList.contains('auth-pending')) {
        const detail = event.message ? `：${event.message}` : '';
        revealAuthFallback(`页面初始化失败${detail}`);
      }
      console.error(event.error || event.message);
    });
    window.addEventListener('unhandledrejection', event => {
      if (document.body.classList.contains('auth-pending')) {
        const reason = event.reason?.message || String(event.reason || '未知错误');
        revealAuthFallback(`页面初始化失败：${reason}`);
      }
      console.error(event.reason);
    });
    const appManifest = document.getElementById('appManifest');
    const appIcon = document.getElementById('appIcon');

    document.getElementById('brandIcon').src = `${base}/api/assets/openai`;
    const list = document.getElementById('conversationList');

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    function linkHtml(label, url) {
      let hostname = '';
      try { hostname = new URL(url.replace(/&amp;/g, '&')).hostname.toLowerCase(); } catch {}
      const isOpenAI = /(^|\.)openai\.com$/.test(hostname);
      const iconUrl = isOpenAI
        ? `${base}/api/assets/openai`
        : (hostname ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostname)}&sz=32` : '');
      const icon = iconUrl ? `<img class="message-link-icon${isOpenAI ? ' link-icon-openai' : ''}" src="${iconUrl}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : '';
      return `<a class="message-link" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="${url}">${icon}<span>${label}</span></a>`;
    }
    function renderText(text) {
      let html = escapeHtml(text || '');
      html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      const links = [];
      const stashLink = link => `\u0000LINK${links.push(link) - 1}\u0000`;
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => stashLink(linkHtml(label, url)));
      html = html.replace(/(^|[\s(])((?:https?:\/\/)[^\s<]+)/g, (match, prefix, rawUrl) => {
        let url = rawUrl;
        let trailing = '';
        while (/[.,!?;:，。！？；：)\]】》'"”’]$/.test(url)) {
          trailing = url.slice(-1) + trailing;
          url = url.slice(0, -1);
        }
        if (!url) return match;
        let label = '打开链接';
        try { label = new URL(url.replace(/&amp;/g, '&')).hostname.replace(/^www\./, '') || label; } catch {}
        return `${prefix}${stashLink(linkHtml(label, url))}${trailing}`;
      });
      html = html.replace(/\u0000LINK(\d+)\u0000/g, (_, index) => links[Number(index)]);
      html = html.replace(/\n/g, '<br>');
      html = html.replace(/(?:<br>)+(?=<pre\b)/g, '');
      html = html.replace(/(<\/pre>)(?:<br>)+/g, '$1');
      return html;
    }

        label.textContent = event.exitCode === 0 ? '' : '失败';
        check.textContent = event.exitCode === 0 ? '✓' : '!';
        if (event.output && !details.querySelector('pre')) {
          const pre = document.createElement('pre');
          pre.textContent = event.output;
          details.appendChild(pre);
        }
      } else {
        label.textContent = '正在执行';
        check.textContent = '';
      }
      updateCommandGroup(group);
      updateRunCount(panel);
    }
    function appendWaveText(node, value) {
      Array.from(String(value || '')).forEach((character, index) => {
        const span = document.createElement('span');
        span.className = 'run-wave-char';
        span.style.setProperty('--wave-index', String(index));
        span.textContent = character;
        node.appendChild(span);
      });
    }
    function scheduleRunAutoscroll() {
      if (suppressRunAutoscroll || runAutoscrollFrame || !messages) return;
      runAutoscrollFrame = requestAnimationFrame(() => {
        runAutoscrollFrame = 0;
        messages.scrollTop = messages.scrollHeight;
      });
    }
    function appendRunEvent(event) {
      const panel = activeRunPanel || createRunPanel();
      if (event.type === 'accepted' || event.type === 'thread') return;
      if (event.type === 'status') {
        const title = /完成/.test(event.text || '') ? '已完成' : (/等待/.test(event.text || '') ? '等待响应' : '思考中');
        panel.querySelector('.run-title').textContent = title;
        if (/完成/.test(event.text || '')) panel.classList.add('done');
        updateRunCount(panel);
        return;
      }
      if (event.type === 'context_compacted') {
        const events = panel.querySelector('.run-events');
        const row = document.createElement('div');
        row.className = 'run-event run-context-compacted';
        const icon = document.createElement('span');
        icon.className = 'run-event-icon';
        icon.textContent = '↻';
        const body = document.createElement('div');
        body.className = 'run-event-body';
        const text = document.createElement('span');
        text.className = 'run-event-text';
        text.textContent = '上下文已自动压缩';
        body.appendChild(text);
        row.appendChild(icon);
        row.appendChild(body);
        events.appendChild(row);
        updateRunCount(panel);
        scheduleRunAutoscroll();
        return;
      }
      if (event.type === 'file_change') return;
      if (event.type === 'process') {
        const details = processDataText(event.data);
        if (!details || details === '{}' || details === '[]') return;
        event = {...event, type: 'tool', tool: event.tool || '其他步骤'};
      }
      if (event.type === 'tool' && event.tool === 'todo_list') {
        upsertTodoList(panel, event);
        scheduleRunAutoscroll();
        return;
      }
      if (event.type === 'tool' && event.tool === 'web_search') {
        upsertWebSearchEvent(panel, event);
        scheduleRunAutoscroll();
        return;
      }
      if (event.type === 'tool_started' || event.type === 'tool_completed') {
        upsertTerminalEvent(panel, event);
        scheduleRunAutoscroll();
        return;
      }
      const events = panel.querySelector('.run-events');
      const row = document.createElement('div');
      row.className = `run-event run-${event.type} ${event.type === 'error' ? 'error' : ''}`;
      if (event.type === 'thought') {
        panel.querySelectorAll('.run-active-line').forEach(active => active.classList.remove('run-active-line'));
        row.classList.add('run-active-line');
      }
      const icon = document.createElement('span');
      icon.className = 'run-event-icon';
      const body = document.createElement('div');
      body.className = 'run-event-body';
      const label = document.createElement('span');
      label.className = 'run-event-label';
      let text = '';
      if (event.type === 'thought') {
        icon.textContent = ''; label.textContent = ''; text = event.text || '';
      } else if (event.type === 'tool_started') {
        icon.textContent = '⌘'; label.textContent = '调用终端'; text = '正在执行';
      } else if (event.type === 'tool_completed') {
        icon.textContent = event.exitCode === 0 ? '✓' : '!'; label.textContent = '终端完成'; text = event.status || '';
      } else if (event.type === 'file_change') {
        icon.textContent = '✎'; label.textContent = '文件变更'; text = '已产生文件修改';
      } else if (event.type === 'tool') {
        icon.textContent = '◌'; label.textContent = '工具'; text = event.tool || '工具调用';
      } else if (event.type === 'diagnostic') {
        icon.textContent = '!'; label.textContent = '诊断'; text = event.text || '';
      } else if (event.type === 'error') {
        icon.textContent = '!'; label.textContent = '错误'; text = event.text || '';
      } else {
        icon.textContent = '·'; label.textContent = event.tool || '过程'; text = event.text || '';
      }
      body.appendChild(label);
      if (text) {
        const textNode = document.createElement('span');
        textNode.className = 'run-event-text';
        textNode.textContent = text;
        body.appendChild(textNode);
      }
      if (event.command) {
        const command = document.createElement('code');
        command.className = 'run-event-command';
        command.textContent = event.command;
        body.appendChild(command);
      }
      const payload = event.output || processDataText(event.data);
      if (payload) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = event.output ? '查看终端输出' : '查看详细信息';
        const pre = document.createElement('pre');
        pre.textContent = payload;
        details.appendChild(summary);
        details.appendChild(pre);
        body.appendChild(details);
      }
      row.appendChild(icon);
      row.appendChild(body);
      events.appendChild(row);
      updateRunCount(panel);
      scheduleRunAutoscroll();
    }
    function removeLastThought(answer = '') {
      const panel = activeRunPanel;
      const thoughts = panel ? panel.querySelectorAll('.run-thought') : [];
      const normalizedAnswer = String(answer || '').replace(/\s+/g, ' ').trim();
      if (!normalizedAnswer) return;
      const matching = Array.from(thoughts).reverse().find(item => item.textContent.replace(/\s+/g, ' ').trim() === normalizedAnswer);
      if (!matching) return;
      matching.remove();
      updateRunCount(panel);
    }
    function finishRunPanel() {
      const panel = activeRunPanel;
      if (!panel) return;
      panel.classList.add('done', 'collapsed');
      panel.querySelector('.run-header')?.setAttribute('aria-expanded', 'false');
      updateRunCount(panel);
    }
    async function streamMessage(id, payload) {
      const controller = new AbortController();
      activeStreamController = controller;
      activeStreamId = id;
      activeStreamStartedAt = Date.now();
      let lastActivityAt = Date.now();
      const streamWatchdog = window.setInterval(() => {
        if (!controller.signal.aborted && Date.now() - lastActivityAt > 45000) controller.abort();
      }, 15000);
      try {
        const response = await fetch(`${base}/api/chat/stream`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          const error = new Error(data.error || '请求失败');
          error.status = response.status;
          throw error;
        }
        if (!response.body) throw new Error('浏览器不支持实时响应流');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let finalData = null;
        let errorData = null;
        const consume = line => {
          if (!line.trim()) return;
          lastActivityAt = Date.now();
          let event;
          try { event = JSON.parse(line); } catch { return; }
          if (event.type === 'heartbeat') return;
          if (event.type === 'final') {
            removeLastThought(event.answer || event.message?.text || '');
            finalData = event;
          }
          else if (event.type === 'title') {
            if (currentConversationId === id) document.getElementById('chatTitle').textContent = event.title || '新对话';
            const item = conversations.find(item => item.id === id);
            if (item) item.title = event.title || item.title;
            renderList();
          }
          else if (event.type === 'error') errorData = event;
          else if (event.type === 'done') {
            activeRunPanel?.classList.add('done');
            if (activeRunPanel) updateRunCount(activeRunPanel);
          }
          else appendRunEvent(event);
        };
        while (true) {
          const chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, {stream: true});
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          lines.forEach(consume);
        }
        buffer += decoder.decode();
        consume(buffer);
        if (!finalData) {
          const error = new Error(errorData?.text || 'Codex 没有返回最终结果');
          error.messageData = errorData?.message || null;
          error.streamDisconnected = true;
          throw error;
        }
        return finalData;
      } catch (error) {
        if (!error.status) error.streamDisconnected = true;
        if (controller.signal.aborted) error.clientAborted = true;
        throw error;
      } finally {
        window.clearInterval(streamWatchdog);
        if (activeStreamController === controller) {
          activeStreamController = null;
          activeStreamId = null;
          activeStreamStartedAt = 0;
        }
      }
    }
    function addOptimisticMessage(text, images) {
      if (messageColumn.querySelector('.welcome')) messageColumn.innerHTML = '';
      renderMessage({role: 'user', text, images: images.map(item => ({name: item.file.name, url: item.dataUrl})), createdAt: new Date().toISOString()});
      createRunPanel();
      activeRunEventRunId = null;
      activeRunRenderedEventCount = 0;
      appendRunEvent({type: 'status', text: '等待 Codex 响应'});
      messages.scrollTop = messages.scrollHeight;
    }
    async function sendMessage(event) {
      event.preventDefault();
      if (busy) return stopMessage();
      if (!currentConversationId) return;
      const text = input.value.trim();
      if (!text && !pendingImages.length) return;
      const files = pendingImages.slice();
      conversationCache.delete(currentConversationId);
      addOptimisticMessage(text, files);
      setConversationRunning(currentConversationId, true);
      input.value = '';
      input.style.height = 'auto';
      pendingImages = [];
      renderPendingImages();
      setBusy(true);
      const id = currentConversationId;
      const sendToken = ++activeSendToken;
      let keepBusy = false;
      try {
        const result = await streamMessage(id, {
          conversationId: id,
          model: currentSettings.model,
          reasoningEffort: currentSettings.reasoningEffort,
          message: text,
          images: files.map(item => ({name: item.file.name, type: item.file.type, data: item.dataUrl}))
        });
        finishRunPanel();
        setConversationRunning(id, false);
        if (currentConversationId === id && result.message) renderMessage(result.message, {skipRunEvents: true});
        if (activeConversationData?.id === id && result.message) {
          activeConversationData.messages = [...(activeConversationData.messages || []), result.message];
          updateDesktopRail(activeConversationData);
        }
        if (currentConversationId === id && result.conversation) document.getElementById('chatTitle').textContent = result.conversation.title || '新对话';
        await loadList();
      } catch (error) {
        if (sendToken !== activeSendToken) return;
        if (error.status === 409) {
          try {
            keepBusy = await recoverConversationAfterConflict(id);
            showToast(keepBusy ? '上一条消息仍在处理中，已恢复监控。' : '上一条消息已经结束，请重新加载对话。');
          } catch (recoverError) {
            if (currentConversationId === id) {
              keepBusy = true;
              startActiveRunMonitor(id);
            }
            showToast(recoverError.message || error.message);
          }
        } else if (error.streamDisconnected && currentConversationId === id) {
          try {
            keepBusy = await recoverConversationAfterConflict(id);
            showToast(keepBusy ? '实时连接已断开，后台仍在处理中。' : '实时连接已断开，已恢复最终结果。');
          } catch (recoverError) {
            if (currentConversationId === id) {
              keepBusy = true;
              startActiveRunMonitor(id);
            }
            showToast(`连接中断，恢复失败：${recoverError.message || error.message}`);
          }
        } else {
          if (error.messageData && currentConversationId === id) renderMessage(error.messageData, {skipRunEvents: true});
          appendRunEvent({type: 'error', text: error.message});
          activeRunPanel?.classList.add('done');
          if (activeRunPanel) updateRunCount(activeRunPanel);
          setConversationRunning(id, false);
          showToast(error.message);
          await loadList();
        }
      }
      if (!keepBusy) setBusy(false);
      input.focus();
    }
    let stopRequested = false;
    async function stopMessage() {
      if (!busy || stopRequested) return;
      const id = currentConversationId;
      stopRequested = true;
      send.disabled = true;
      activeSendToken += 1;
      if (activeStreamController && activeStreamId === id) activeStreamController.abort();
      // The server may need a moment to terminate Codex, but the browser UI
      // must become usable immediately. A later refresh/409 recovery will
      // pick up the final state if the process is still winding down.
      setBusy(false, false);
      showToast('正在停止当前任务…');
      try {
        await request('/api/chat/stop', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({conversationId: currentConversationId})
        });
        if (currentConversationId === id) {
          try {
            const data = await request(`/api/conversations/${encodeURIComponent(id)}`);
            conversationCache.set(id, data.conversation);
            renderConversation(data.conversation);
            if (data.conversation.running) startActiveRunMonitor(id);
            else setBusy(false);
            await loadList();
          } catch (refreshError) {
            showToast(`任务已请求停止，刷新状态失败：${refreshError.message}`);
          }
        }
      } catch (error) {
        showToast(error.message);
      } finally {
        stopRequested = false;
        if (!busy) send.disabled = false;
      }
    }
    async function submitAuth(event) {
      event.preventDefault();
      const username = authUsername.value.trim();
      const password = authPassword.value;
      const inviteKey = authInviteKey.value.trim();
      if (!username || !password || (authMode === 'register' && !inviteKey)) return;
      try { localStorage.setItem('codexRememberMe', authRemember.checked ? '1' : '0'); } catch {}
      authSubmit.disabled = true;
      setAuthError('');
      const endpoint = authMode === 'register' ? '/api/auth/register' : '/api/auth/login';
      try {
        const data = await request(endpoint, {
          skipAuthHandling: true,
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password, inviteKey, rememberMe: authRemember.checked})
        });
        hideAuthScreen(data.user);
        await startApp();
      } catch (error) {
        setAuthError(error.message || '操作失败');
      } finally {
        authSubmit.disabled = false;
      }
    }
    async function logout() {
      if (settingsLogoutButton) settingsLogoutButton.disabled = true;
      try { await request('/api/auth/logout', {skipAuthHandling: true, method: 'POST'}); } catch {}
      location.reload();
    }
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 150)}px`; });
    input.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return;
      if (!window.matchMedia('(min-width: 781px)').matches) return;
      event.preventDefault();
      document.getElementById('form').requestSubmit();
    });
    document.getElementById('form').addEventListener('submit', sendMessage);
    document.getElementById('newChat').addEventListener('click', createConversation);
    document.getElementById('navNewTask')?.addEventListener('click', createConversation);
    document.getElementById('navSearch')?.addEventListener('click', () => {
      search.focus();
      search.select();
    });
    document.getElementById('navPlugins')?.addEventListener('click', () => showToast('插件面板暂未接入'));
    settingsButton?.addEventListener('click', openSettings);
    document.getElementById('closeSettings')?.addEventListener('click', closeSettings);
    document.getElementById('settingsBackdrop')?.addEventListener('click', closeSettings);
    settingsTabs.appearance?.addEventListener('click', () => selectSettingsPage('appearance'));
    settingsTabs.account?.addEventListener('click', () => selectSettingsPage('account'));
    settingsTabs.admin?.addEventListener('click', () => selectSettingsPage('admin'));
    settingsAppearance.forEach(input => input.addEventListener('change', () => applyTheme(input.value)));
    generateRegistrationKeyButton?.addEventListener('click', generateRegistrationKey);
    document.getElementById('copyRegistrationKey')?.addEventListener('click', () => copyMessage(registrationKeyValue?.textContent || ''));
    settingsLogoutButton?.addEventListener('click', logout);
    document.getElementById('deleteChat').addEventListener('click', deleteCurrentConversation);
    document.getElementById('openSidebar').addEventListener('click', openSidebar);
    document.getElementById('closeSidebar').addEventListener('click', closeSidebar);
    backdrop.addEventListener('click', closeSidebar);
    authForm.addEventListener('submit', submitAuth);
    authSwitch.addEventListener('click', () => setAuthMode(authMode === 'login' ? 'register' : 'login'));
    search.addEventListener('input', renderList);
    modelButton.addEventListener('click', event => {
      event.stopPropagation();
      modelMenu.hidden = !modelMenu.hidden;
      modelButton.classList.toggle('open', !modelMenu.hidden);
    });
    modelMenu.addEventListener('click', event => event.stopPropagation());
    document.addEventListener('click', () => { modelMenu.hidden = true; modelButton.classList.remove('open'); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeSettings(); modelMenu.hidden = true; modelButton.classList.remove('open'); } });
    attach.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
    input.addEventListener('paste', event => {
      const files = Array.from(event.clipboardData?.files || []).filter(file => file.type.startsWith('image/'));
      if (files.length) addFiles(files);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') scheduleCurrentConversationSync();
    });
    window.addEventListener('pageshow', scheduleCurrentConversationSync);
    window.addEventListener('online', scheduleCurrentConversationSync);

    async function startApp() {
      if (appStarted) return;
      appStarted = true;
      try {
        const modelData = await request('/api/models');
        modelCatalog = modelData.models || [];
        setCurrentSettings({model: modelData.defaultModel, reasoningEffort: modelData.defaultReasoningEffort});
        await loadList();
        const saved = localStorage.getItem('codexConversation');
        const target = conversations.find(item => item.id === saved) || conversations[0];
        if (target) await selectConversation(target.id);
        else await createConversation();
      } catch (error) {
        appStarted = false;
        showToast(error.message);
        renderWelcome();
      }
    }
    (async function boot() {
      try {
        const status = await request('/api/auth/status', {skipAuthHandling: true});
        if (status.authenticated) {
          hideAuthScreen(status.user);
          await startApp();
        } else {
          authStatus = status;
          authLogo.src = `${base}/api/assets/openai`;
          showAuthScreen(status);
        }
      } catch (error) {
        authLogo.src = `${base}/api/assets/openai`;
        showAuthScreen();
        setAuthError(error.message || '无法连接到认证服务');
      }
    })();
  </script>
</body>
